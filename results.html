<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мониторинг — Тест «Отечественная война 1812 года»</title>
<style>
  :root{ --dark:#14291F; --green:#2F5D46; --gold:#C9A227; --text:#1E2A24; --muted:#6F7D75;
    --card:#F4F6F4; --line:#DCE3DD; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Calibri,Arial,sans-serif;color:var(--text);background:#F4F1E8;
    min-height:100vh;padding:34px 20px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-family:Georgia,serif;color:var(--green);font-size:clamp(24px,4vw,34px);margin-bottom:4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 3px 12px rgba(20,41,31,.08)}
  .stat b{display:block;font-family:Georgia,serif;font-size:34px;color:var(--green)}
  .stat span{font-size:13px;color:var(--muted)}
  .panel{background:#fff;border-radius:12px;padding:22px;box-shadow:0 3px 12px rgba(20,41,31,.08);margin-bottom:26px}
  .panel h2{font-family:Georgia,serif;font-size:18px;color:var(--green);margin-bottom:14px}
  .dist-row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .dist-row .lbl{width:56px;font-size:13.5px;color:var(--muted);flex-shrink:0}
  .dist-row .bar{flex:1;height:20px;background:#E8ECE9;border-radius:5px;overflow:hidden}
  .dist-row .bar i{display:block;height:100%;background:var(--gold);border-radius:5px;min-width:2px}
  .dist-row .n{width:60px;font-size:13.5px;font-weight:bold;flex-shrink:0}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{background:var(--card);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:12.5px;
    text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td.sc{font-family:Georgia,serif;font-size:17px;font-weight:bold;color:var(--green)}
  tr:hover td{background:#FBFAF5}
  button{padding:11px 26px;border:none;border-radius:10px;background:var(--green);color:#fff;
    font-size:14.5px;font-weight:bold;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .empty{color:var(--muted);font-size:15px;text-align:center;padding:30px}
  .err{color:#8A3B3B;background:#F8ECEC;padding:12px;border-radius:9px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Мониторинг теста «Отечественная война 1812 года»</h1>
  <div class="sub">Все прохождения викторины и ответы на вопросы обратной связи. Обновляется по кнопке.</div>
  <div id="err" class="err" style="display:none"></div>
  <div class="stats">
    <div class="stat"><b id="st-count">0</b><span>прохождений</span></div>
    <div class="stat"><b id="st-avg">—</b><span>средний балл (из 6)</span></div>
    <div class="stat"><b id="st-best">—</b><span>лучший результат</span></div>
    <div class="stat"><b id="st-full">0</b><span>прошли на 6 из 6</span></div>
  </div>
  <div class="panel">
    <h2>Распределение баллов</h2>
    <div id="dist"></div>
  </div>
  <div class="panel">
    <h2>Все попытки</h2>
    <div id="tbl"></div>
  </div>
  <button id="refresh" onclick="load()">Обновить данные</button>
</div>

<script>
const GH_TOKEN = "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";
const GH_API = "https://api.github.com/gists/477d3b70fdc95957a76a8ab13030a415";

async function load(){
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Загружаю…";
  const err = document.getElementById("err");
  err.style.display = "none";
  try {
    const r = await fetch(GH_API, { headers: { Authorization: "Bearer " + GH_TOKEN,
      Accept: "application/vnd.github+json" }, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const g = await r.json();
    const recs = JSON.parse((g.files && g.files["results.json"] && g.files["results.json"].content) || "[]");
    recs.sort((a, b) => (b.ts || "").localeCompare(a.ts || ""));
    render(recs);
  } catch (e) {
    err.style.display = "block";
    err.textContent = "Не удалось загрузить данные: " + e.message;
  }
  btn.disabled = false; btn.textContent = "Обновить данные";
}

function render(recs){
  const n = recs.length;
  document.getElementById("st-count").textContent = n;
  const avg = n ? (recs.reduce((s, r) => s + r.score, 0) / n) : 0;
  document.getElementById("st-avg").textContent = n ? avg.toFixed(1) : "—";
  const best = n ? Math.max(...recs.map(r => r.score)) : 0;
  document.getElementById("st-best").textContent = n ? best + "/6" : "—";
  document.getElementById("st-full").textContent = recs.filter(r => r.score === 6).length;

  // распределение 0..6
  const counts = Array(7).fill(0);
  recs.forEach(r => counts[Math.max(0, Math.min(6, r.score))]++);
  const max = Math.max(1, ...counts);
  document.getElementById("dist").innerHTML = counts.map((c, s) =>
    `<div class="dist-row"><span class="lbl">${s} балл.</span>
     <span class="bar"><i style="width:${Math.round(c / max * 100)}%"></i></span>
     <span class="n">${c} чел.</span></div>`).join("");

  document.getElementById("tbl").innerHTML = n ? `
    <table>
      <tr><th>Дата и время</th><th>Балл</th><th>Интерес к теме</th><th>Знания до теста</th><th>Хочет узнать</th></tr>
      ${recs.map(r => `<tr>
        <td>${(r.ts || "").replace("T", " ").replace(/\.\d+Z$/, "").replace(/-/g, ".")}</td>
        <td class="sc">${r.score} / 6</td>
        <td>${esc(r.interest)}</td><td>${esc(r.selfKnow)}</td><td>${esc(r.wantMore)}</td>
      </tr>`).join("")}
    </table>` : `<div class="empty">Пока никто не прошёл тест. Ссылка на тест: …/war-1812-quiz/</div>`;
}
function esc(s){ return String(s || "—").replace(/</g, "&lt;"); }
load();
</script>
</body>
</html>
